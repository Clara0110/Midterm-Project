    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.css" />
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
    <style>
      footer {
        margin: 15px;
      }

      .container {
        margin: 70px;
        display: grid;
        grid-template-areas: "menu content";
        grid-template-columns: 1fr 3fr;
        gap: 3px;
        padding: 5px;
      }
      .container div {
        background-color: white;
        padding: 10px;
      }

      .container div.menu {
        margin-top: 10px;
        grid-area: menu;
      }
      .container div.content {
        grid-area: content;
      }

      .content > .list-group {
        flex-direction: row;
      }

      .content > .content-list-group {
        display: flex;
        padding-left: 0;
        margin-bottom: 0;
        border-radius: 0.375rem;
      }

      .content > .content-list-group > .content-list-group-item {
        position: relative;
        display: block;
        padding: 0.5rem 1rem;
        color: #212529;
        text-decoration: none;
        background-color: #fff;
        border: 1px solid #dee2e6;
      }

      .content > .content-list-group > .start {
        border-top-left-radius: 0.375rem;
        border-bottom-left-radius: 0.375rem;
      }

      .content > .content-list-group > .end {
        border-top-right-radius: 0.375rem;
        border-bottom-right-radius: 0.375rem;
      }

      .content > .content-list-group > .list-group-item-action {
        width: 100%;
        color: rgba(33, 37, 41, 0.75);
        text-align: inherit;
      }

      .content > .content-list-group > .list-group-item-action:hover {
        z-index: 1;
        color: #000;
        text-decoration: none;
        background-color: #f8f9fa;
      }

      .content > .content-list-group > .list-group-item-action:focus {
        z-index: 1;
        color: #000;
        text-decoration: none;
        background-color: #f8f9fa;
      }

      .content > .content-list-group > .list-group-item-action:active {
        color: #212529;
        background-color: #e9ecef;
      }
    </style>
  </head>
