<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    table,
    td,
    th {
      border: 1px solid;
      text-align: center;
    }

    table {
      border-collapse: collapse;
    }
  </style>
</head>

<body>
  <table>
    <thead>
      <tr>
        <th>A</th>
        <th>A</th>
        <th>A</th>
        <th>A</th>
        <th>A</th>
        <th>A</th>
        <th>A</th>
        <th>A</th>
        <th>A</th>
        <th>A</th>
        <th>A</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <script>
    const date = new Date();
    const dd = String(date.getDate()).padStart(2, '0');
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const yyyy = date.getFullYear();

    const tbody = document.getElementById("tbody");

    const data = {
      A: {
        出勤日期: `${yyyy}/${mm}/${dd}`,
        上班: "09:00",
        下班: "17:00",
        遲到: "",
        早退: "",
        請假時數: "",
        加班始: "hfh",
        加班末: "serry",
        加班總時數: "btaer",
        實際出勤總時數: "hfg",
        備註: "vdtzy",
      },
      B: {
        出勤日期: `${yyyy}/${mm}/${dd}`,
        上班: "09:00",
        下班: "17:00",
        遲到: "",
        早退: "",
        請假時數: "",
        加班始: "hfh",
        加班末: "serry",
        加班總時數: "btaer",
        實際出勤總時數: "hfg",
        備註: "vdtzy",
      },
      C: {
        出勤日期: `${yyyy}/${mm}/${dd}`,
        上班: "09:00",
        下班: "17:00",
        遲到: "",
        早退: "",
        請假時數: "",
        加班始: "hfh",
        加班末: "serry",
        加班總時數: "btaer",
        實際出勤總時數: "hfg",
        備註: "vdtzy",
      },
    };

    const dFrag = document.createDocumentFragment();

    Object.values(data).forEach(term => {
      const row = document.createElement("tr");
      Object.values(term).forEach( jia => {
        const cell = document.createElement("td");
        cell.textContent = jia;
        row.appendChild(cell);
      });
      dFrag.appendChild(row);
    });
     tbody.appendChild(dFrag);
  </script>
</body>

</html>
