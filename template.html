<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* CSS 樣式設計 */
.attendance-item {
  display: flex;
  justify-content: space-between; /* 讓名字靠左，狀態靠右，畫面更整齊 */
  align-items: center;
  padding: 12px 16px;
  background-color: #ffffff;
  border: 1px solid #e0e0e0;
  border-radius: 8px; /* 圓角讓視覺更柔和 */
  margin-bottom: 8px;
}

.employee-name {
  font-weight: 500;
  color: #333333;
}

/* 狀態標籤的基礎樣式 */
.status-badge {
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: bold;
}

/* 針對不同狀態給予不同顏色 */
.is-warning {
  background-color: #fff3e0;
  color: #e65100; /* 橘色代表提醒（未打卡、未簽退） */
}

.is-danger {
  background-color: #ffebee;
  color: #c62828; /* 紅色代表警告（遲到、早退） */
}
    </style>
</head>

<body>
    <!-- HTML 結構 -->
<div class="attendance-item">
  <span class="employee-name">職員01</span>
  
  <!-- 依照您的 TypeScript 邏輯，渲染對應的狀態標籤 -->
  <span class="status-badge is-warning">未打卡</span>
  <!-- 若是遲到，可以替換成： <span class="status-badge is-danger">遲到</span> -->
</div>
</body>

</html>
